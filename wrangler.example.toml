# Template used by `npm run setup`, which copies it to wrangler.toml with your values filled in.
# wrangler.toml is personal (it has your storage ID), so it's ignored by git.

name = "__NAME__"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Your name (shown on the People page), and the timezone used to show due dates.
OWNER_NAME = "__OWNER_NAME__"
TIMEZONE = "__TIMEZONE__"

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

# Secret, set by setup:  ACCESS_KEY (the owner's key; it also opens the /admin People page)
